<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi PHO Lapangan</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0c">
  
  <!-- Icon untuk iOS (Apple) -->
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/0a0a0c/00f0ff?text=PHO">

  <style>
    body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; background-color: #0a0a0c; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <!-- JANGAN LUPA: Ganti dengan URL /exec Apps Script Bapak -->
  <iframe src="https://script.google.com/macros/s/AKfycbzUsASce9TAK61_3KtToEwchIywr_VAYkjVefIT1_U-P92uIKfQZUxKMrL8ueBoHQP9AQ/exec" allow="camera"></iframe>

  <script>
    // Daftarkan Service Worker Asli
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker PWA sukses terdaftar!', reg.scope))
          .catch(err => console.error('Pendaftaran Service Worker gagal:', err));
      });
    }
  </script>

</body>
</html>
